name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  separation-of-concerns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all frontend JS
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

      # Enforces ARCHITECTURE.md §1: the browser bundle must never reference
      # weather providers or API keys (Phase 4: no exemptions remain).
      - name: Guard — no provider URLs / keys in frontend
        run: |
          if grep -rInE 'openweathermap\.org|open-meteo\.com|bigdatacloud\.net|appid=|API_KEY' frontend; then
            echo "::error::Provider reference found in frontend — all requests must route through the backend (see ARCHITECTURE.md)"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Contract tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E suite
        run: npx playwright test
        working-directory: e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 5
