# Render Blueprint — deploy SkyCast with one click:
#   Render dashboard → New → Blueprint → pick this repo → Apply.
# The OPENWEATHER_API_KEY is intentionally `sync: false`: Render will prompt
# you to paste it in the dashboard — it never lives in git.
services:
  - type: web
    name: skycast
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
